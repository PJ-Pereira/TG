<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEI Digital – Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #e8eef7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .login-card {
      background: #fff;
      border-radius: 18px;
      padding: 48px 44px;
      width: 100%;
      max-width: 430px;
      box-shadow: 0 8px 32px rgba(0,0,0,.09);
    }
    .logo-circle {
      width: 68px; height: 68px;
      background: #6d28d9;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
    }
    .logo-circle i { color: #fff; font-size: 30px; }
    .brand-name { font-size: 26px; font-weight: 700; color: #0f172a; text-align: center; margin-bottom: 4px; }
    .brand-sub  { font-size: 14px; color: #94a3b8; text-align: center; margin-bottom: 36px; }
    .form-label { font-size: 13.5px; font-weight: 500; color: #374151; }
    .form-control {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
    }
    .form-control:focus {
      border-color: #6d28d9;
      box-shadow: 0 0 0 3px rgba(109,40,217,.12);
    }
    .btn-login {
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background .15s;
    }
    .btn-login:hover { background: #1e293b; }
    .alert { border-radius: 8px; font-size: 13.5px; }
    .link-esqueci { font-size: 13.5px; color: #6d28d9; text-decoration: none; }
    .link-esqueci:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-circle">
      <i class="bi bi-book-half"></i>
    </div>
    <div class="brand-name">SEI Digital</div>
    <div class="brand-sub">Sistema de Educação Inclusiva</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category if category in ('danger', 'success', 'info') else 'warning' }} alert-dismissible fade show py-2 mb-3">
          {{ msg }}
          <button type="button" class="btn-close btn-close-sm" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" novalidate>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Entrar</button>
      <div class="text-center mt-3">
        <a href="{{ url_for('esqueci_senha') }}" class="link-esqueci">Esqueci minha senha</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
